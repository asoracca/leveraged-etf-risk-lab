name: Offline validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/risk-lab-mpl
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-regimes.txt
      - name: Offline unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce synthetic report
        run: python -m src.demo --seed 42 --output reports/demo.json
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-report-${{ matrix.python-version }}
          path: reports/demo.json
